<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Central de Ajuda LavaJá - Primeiros Passos e Conceitos Básicos." />
  <title>Ajuda | LavaJá</title>

  <!-- PWA & Mobile -->
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <!-- Fonts & Tailwind -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- App Styles -->
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/ux-improvements.css">
  <script src="js/theme-init.js"></script>

  <style>
    /* Smooth accordion transition */
    .accordion-content {
      transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
    }
    .accordion-content.open {
      opacity: 1;
    }
    .rotate-180 {
      transform: rotate(180deg);
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex text-gray-800" data-page="ajuda">
  
  <aside data-sidebar></aside>

  <main id="main-content" class="flex-1 w-full main-content" role="main">
    
    <!-- Header Style Dashboard -->
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">
      <div class="flex items-center justify-between flex-wrap gap-4 mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Central de Ajuda</h1>
        
        <!-- Quick Actions -->
        <div class="flex items-center gap-2">
          <a href="dashboard.html" class="quick-action-btn bg-sky-500 hover:bg-sky-600 text-white px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-all">
             <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
             <span class="hidden sm:inline">Dashboard</span>
          </a>
          <a href="receitas.html" class="quick-action-btn bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-all">
             <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
             <span class="hidden sm:inline">Receitas</span>
          </a>
          <a href="despesas.html" class="quick-action-btn bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-all">
             <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/></svg>
             <span class="hidden sm:inline">Despesas</span>
          </a>
        </div>
      </div>

      <div class="bg-gradient-to-r from-sky-600 to-blue-700 text-white rounded-2xl p-8 mb-8 text-center shadow-lg">
        <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-4 backdrop-blur-sm">
           <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <h2 class="text-2xl font-bold mb-2">Como podemos ajudar?</h2>
        <p class="text-sky-100 max-w-2xl mx-auto">Conceitos básicos e primeiros passos no sistema LavaJá.</p>
      </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <!-- Seção Única: Primeiros Passos -->
      <section class="bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden mb-12">
        <div class="p-6 border-b border-gray-100 bg-gray-50 flex items-center gap-3">
           <div class="p-2 bg-purple-100 rounded-lg text-purple-600">
             <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
           </div>
           <h2 class="text-lg font-bold text-gray-800">Primeiros Passos e Conceitos</h2>
        </div>

        <div class="p-6 space-y-4" id="faq-container">
          <!-- Conteúdo populado via JS -->
          <div class="animate-pulse space-y-4">
             <div class="h-12 bg-gray-100 rounded-lg"></div>
             <div class="h-12 bg-gray-100 rounded-lg"></div>
          </div>
        </div>
      </section>

      <!-- Feedback Rápido (Simplificado) -->
      <section class="text-center mb-12">
        <p class="text-gray-500 text-sm mb-4">Este conteúdo foi útil?</p>
        <div class="flex justify-center gap-3" id="feedback-buttons">
            <button class="px-4 py-2 bg-white border border-gray-200 rounded-full hover:bg-green-50 hover:border-green-200 hover:text-green-700 transition-colors feedback-btn" data-value="yes">
               👍 Sim
            </button>
            <button class="px-4 py-2 bg-white border border-gray-200 rounded-full hover:bg-red-50 hover:border-red-200 hover:text-red-700 transition-colors feedback-btn" data-value="no">
               👎 Não
            </button>
        </div>
        <div id="feedback-response" class="hidden mt-2 text-green-600 text-sm font-medium">
            Obrigado pelo feedback!
        </div>
      </section>

    </div>
  </main>

  <!-- Scripts -->
  <script type="module" src="js/firebase-init.js"></script>
  <script src="js/firebase-sync.js" defer></script>
  <script src="js/auth-service.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/data-store.js" defer></script>
  <script src="js/shared-utils.js" defer></script>
  <script src="js/ui-utils.js" defer></script>
  <script src="js/theme-toggle.js" defer></script>
  <script src="js/ui/connection-status.js" defer></script>
  <script src="js/layout.js" defer></script>
  <script src="js/sidebar-nav.js" defer></script>
  <script src="js/ajuda.js" defer></script>

</body>
</html>

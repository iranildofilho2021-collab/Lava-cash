<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LavaJá Lavanderia</title>
  
  <!-- PWA & Mobile -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0ea5e9">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- App Styles -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  
  <!-- Theme Init (Dark Mode) -->
  <script src="js/theme-init.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

  <!-- Background Decoration -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-20 -left-20 w-96 h-96 bg-sky-500/20 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 right-0 w-80 h-80 bg-blue-600/20 rounded-full blur-3xl"></div>
  </div>

  <!-- Login Card -->
  <div class="relative w-full max-w-md bg-white rounded-2xl shadow-xl p-8 transform transition-all hover:scale-[1.01]">
    
    <!-- Logo / Header -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-br from-sky-500 to-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-sky-500/30">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">LavaJá Lavanderia</h1>
      <p class="text-gray-500 text-sm mt-2">Bem-vindo de volta! Faça login para continuar.</p>
    </div>

    <!-- Form -->
    <form id="login-form" class="space-y-5" novalidate>
      
      <!-- Email -->
      <div class="group">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1 ml-1">E-mail</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 group-focus-within:text-sky-500 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" /></svg>
          </div>
          <input type="email" id="email" name="email" required
            class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl bg-gray-50 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all"
            placeholder="seu@email.com">
        </div>
        <p class="mt-1 text-xs text-red-500 hidden" id="error-email">Por favor, insira um e-mail válido.</p>
      </div>

      <!-- Senha -->
      <div class="group">
        <div class="flex justify-between items-center mb-1 ml-1">
          <label for="password" class="block text-sm font-medium text-gray-700">Senha</label>
        </div>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 group-focus-within:text-sky-500 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
          </div>
          <input type="password" id="password" name="password" required
            class="block w-full pl-10 pr-10 py-2.5 border border-gray-200 rounded-xl bg-gray-50 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all"
            placeholder="••••••••">
          <!-- Toggle Password -->
          <button type="button" id="btn-toggle-password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
            <svg id="icon-eye" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
            <svg id="icon-eye-off" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>
          </button>
        </div>
        <div class="flex justify-end mt-1">
           <a href="#" class="text-xs font-medium text-sky-600 hover:text-sky-700 hover:underline">Esqueceu a senha?</a>
        </div>
        <p class="mt-1 text-xs text-red-500 hidden" id="error-password">A senha é obrigatória.</p>
      </div>

      <!-- Botão Entrar -->
      <button type="submit" id="btn-login" class="w-full bg-gradient-to-r from-sky-600 to-blue-700 hover:from-sky-700 hover:to-blue-800 text-white font-bold py-3 px-4 rounded-xl shadow-lg transform transition-all active:scale-[0.98] flex items-center justify-center gap-2">
        <span>Entrar</span>
        <svg id="spinner" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </button>

      <!-- Cadastro -->
      <div class="text-center pt-2">
        <p class="text-sm text-gray-600">
          Não tem uma conta? 
          <a href="signup.html" class="font-bold text-sky-600 hover:text-sky-700 hover:underline">Cadastre-se</a>
        </p>
      </div>
    </form>
  </div>
  
  <!-- Footer -->
  <div class="absolute bottom-4 text-center w-full">
     <p class="text-xs text-gray-400">&copy; 2026 LavaJá Lavanderia. Todos os direitos reservados.</p>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/firebase-init.js"></script>
  <script src="js/firebase-sync.js" defer></script>
  <script src="js/data-store.js"></script>
  <script src="js/settings-service.js"></script>
  <script src="js/auth-service.js"></script>
  <script src="js/login.js" type="module"></script>
  <script>
    // Load App Name
    document.addEventListener('DOMContentLoaded', async () => {
        const nameEl = document.querySelector('h1.text-2xl');
        if(nameEl && window.SettingsService) {
            // Try sync first
            const syncName = SettingsService.getAppNameSync();
            if(syncName) nameEl.textContent = syncName;
            
            // Then async update
            const settings = await SettingsService.getSettings();
            if(settings.appName) {
                nameEl.textContent = settings.appName;
                document.title = `Login - ${settings.appName}`;
            }
        }
    });
  </script>
</body>
</html>

<html lang="pt-BR">
<head>

  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | LAVACASH</title>

  <meta name="description" content="Sistema de gestão financeira LAVACASH para lavanderias. Controle receitas, despesas e analise o desempenho do seu negócio.">
  <meta name="theme-color" content="#0ea5e9">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="manifest" href="manifest.json">



  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css?v=20260412">
  <link rel="stylesheet" href="css/utilities.css?v=20260420">
  <link rel="stylesheet" href="css/ui-enhancements.css?v=20260608-tablefit">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- Animated Background -->
  <div class="animated-bg">
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>
    <div class="bg-blob bg-blob-3"></div>
  </div>

  <!-- Login Card -->
  <div id="loginCard" class="glass-card p-8 w-full max-w-md relative z-10 fade-in">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl mb-4 icon-glow" style="background: linear-gradient(135deg, var(--color-accent), #6366f1);">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" class="w-10 h-10">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold" style="color: var(--color-text-primary);">LAVACASH</h1>
      <p class="mt-2" style="color: var(--color-text-muted);">Gestão financeira inteligente</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-5">

      <div class="form-group">
        <label for="email" class="form-label">E-mail</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2" style="color: var(--color-text-muted);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </span>
          <input
            type="email"
            id="email"
            class="input-glass w-full pl-11"
            placeholder="seu@email.com"
            required
            autocomplete="email"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="senha" class="form-label">Senha</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2" style="color: var(--color-text-muted);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </span>
          <input
            type="password"
            id="senha"
            class="input-glass w-full pl-11 pr-11"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
          <button type="button" id="toggleSenha" class="absolute right-3 top-1/2 -translate-y-1/2" style="color: var(--color-text-muted);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
        <div class="mt-2 text-right">
          <a href="reset.html" class="text-sm hover:underline" style="color: var(--color-accent);">Esqueci minha senha</a>
        </div>
      </div>

      <!-- Error Message -->
      <div id="errorMsg" class="hidden p-3 rounded-lg text-sm text-center" style="background: rgba(239, 68, 68, 0.2); color: #f87171;"></div>

      <!-- Submit Button -->
      <button
        type="submit"
        id="btnLogin"
        class="btn btn-primary w-full text-lg py-3"
      >
        <span id="btnText">Entrar</span>
        <span id="btnLoading" class="hidden">
          <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
          </svg>
        </span>
      </button>

      <button
        type="button"
        id="btnGoogleLogin"
        class="btn btn-ghost w-full py-3 flex items-center justify-center gap-3"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#EA4335" d="M12 10.2v3.9h5.4c-.2 1.3-1.5 3.9-5.4 3.9-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.2.8 4 1.5l2.7-2.6C17.1 3.4 14.8 2.4 12 2.4 6.9 2.4 2.8 6.5 2.8 11.6S6.9 20.8 12 20.8c6.9 0 9.1-4.8 9.1-7.3 0-.5-.1-.9-.1-1.2H12Z"/>
        </svg>
        <span id="btnGoogleText">Entrar com Google</span>
        <span id="btnGoogleLoading" class="hidden">
          <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
          </svg>
        </span>
      </button>
    </form>

    <p class="text-center mt-6 text-sm" style="color: var(--color-text-muted);">
      Acesso exclusivo do proprietário
    </p>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/firebase-init.js?v=20261103-pages-sync-v1"></script>
  <script src="js/pwa-init.js?v=20261103-pages-sync-v1"></script>
  <script src="js/auth-service.js?v=20261103-pages-sync-v1"></script>
  <script src="js/user-system.js?v=20261103-pages-sync-v1"></script>
  <script src="js/owner-mode.js?v=20260903-owner-only-v1"></script>

  <script>
    UserSystem.init();
    if (new URLSearchParams(window.location.search).get('sessao') === 'expirada') {
      const errorMsg = document.getElementById('errorMsg');
      if (errorMsg) {
        errorMsg.textContent = 'Sua sessão segura expirou. Entre novamente para carregar os dados do Supabase.';
        errorMsg.classList.remove('hidden');
      }
    }
  </script>

  <style>
    .icon-glow {
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      0% { box-shadow: 0 0 20px rgba(14, 165, 233, 0.4); }
      100% { box-shadow: 0 0 40px rgba(14, 165, 233, 0.7); }
    }
  </style>

  <script>
    // Toggle password visibility
    document.getElementById('toggleSenha')?.addEventListener('click', () => {
      const senhaInput = document.getElementById('senha');
      senhaInput.type = senhaInput.type === 'password' ? 'text' : 'password';
    });

    function setGoogleLoading(isLoading) {
      const btnGoogle = document.getElementById('btnGoogleLogin');
      const btnGoogleText = document.getElementById('btnGoogleText');
      const btnGoogleLoading = document.getElementById('btnGoogleLoading');

      if (btnGoogle) btnGoogle.disabled = isLoading;
      btnGoogleText?.classList.toggle('hidden', isLoading);
      btnGoogleLoading?.classList.toggle('hidden', !isLoading);
    }

    // Login form
    document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const errorMsg = document.getElementById('errorMsg');
      const btnText = document.getElementById('btnText');
      const btnLoading = document.getElementById('btnLoading');

      btnText.classList.add('hidden');
      btnLoading.classList.remove('hidden');
      errorMsg.classList.add('hidden');

      try {
        if (typeof AuthService !== 'undefined' && typeof AuthService.login === 'function') {
          const result = await AuthService.login(email, senha);
          if (!result.success) {
            throw new Error(result.message || 'Não foi possível entrar.');
          }
        } else {
          throw new Error('O serviço de autenticação ainda não carregou. Aguarde e tente novamente.');
        }
        if (!window.FirebaseStore?.checkConnection) throw new Error('A conexão com o Supabase ainda não foi inicializada.');
        await window.FirebaseStore.checkConnection();
        window.location.href = 'dashboard.html';
      } catch (error) {
        errorMsg.textContent = error.message;
        errorMsg.classList.remove('hidden');
        btnText.classList.remove('hidden');
        btnLoading.classList.add('hidden');
      }
    });

    document.getElementById('btnGoogleLogin')?.addEventListener('click', async () => {
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.classList.add('hidden');
      setGoogleLoading(true);

      try {
        if (typeof AuthService === 'undefined' || typeof AuthService.loginWithGoogle !== 'function') {
          throw new Error('Login com Google indisponível no momento.');
        }

        const result = await AuthService.loginWithGoogle();
        if (!result.success) {
          throw new Error(result.message || 'Não foi possível entrar com Google.');
        }

        if (!window.FirebaseStore?.checkConnection) throw new Error('A conexão com o Supabase ainda não foi inicializada.');
        await window.FirebaseStore.checkConnection();
        window.location.href = 'dashboard.html';
      } catch (error) {
        errorMsg.textContent = error.message || 'Erro ao entrar com Google.';
        errorMsg.classList.remove('hidden');
      } finally {
        setGoogleLoading(false);
      }
    });

    // NÃO redirecionar automaticamente - sempre mostrar login
    // O usuário deve fazer login manualmente
  </script>
<script src="js/ui-enhancements.js?v=20261103-pages-sync-v1"></script>
</body>
</html>
